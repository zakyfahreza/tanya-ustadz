<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Kajian — Tanya Muslim Solo</title>
  <meta name="description" content="Pindai QR Code untuk langsung bertanya kepada ustadz saat kajian berlangsung." />
  <meta name="theme-color" content="#2f415b" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { primary: { DEFAULT: '#2f415b', dark: '#22304a' }, accent: { DEFAULT: '#F59E0B' } },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
      } },
    };
  </script>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/store.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="/assets/js/pwa.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-primary to-primary-dark text-white antialiased flex flex-col"
      x-data="qrPage()" x-init="$store.theme.init(); render()">

  <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center">
    <span class="grid place-items-center w-32 h-32 mb-4"><img src="/logo.png" alt="Tanya Muslim Solo" class="w-full h-full object-contain" /></span>
    <h1 class="text-2xl sm:text-3xl font-extrabold">Tanya Muslim Solo</h1>
    <p class="mt-2 text-teal-50/90 max-w-md">Pindai QR Code di bawah untuk langsung mengirim pertanyaan kepada ustadz saat kajian.</p>

    <!-- QR -->
    <div class="mt-8 bg-white rounded-3xl p-6 shadow-2xl">
      <div id="qrcode" class="grid place-items-center"></div>
    </div>

    <p class="mt-5 text-sm text-teal-50/80">atau buka:</p>
    <p class="font-mono font-semibold text-accent break-all" x-text="url"></p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
      <a href="/" class="bg-white text-primary font-semibold px-5 py-2.5 rounded-xl hover:bg-teal-50 transition">Buka Form Pertanyaan</a>
      <button @click="copy()" class="bg-white/15 ring-1 ring-white/30 font-semibold px-5 py-2.5 rounded-xl hover:bg-white/25 transition">Salin Tautan</button>
    </div>
  </main>

  <footer class="py-6 text-center text-sm text-teal-50/70">
    <p>Tampilkan halaman ini di layar saat kajian · © <span x-text="new Date().getFullYear()"></span></p>
  </footer>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('qrPage', () => ({
        url: window.APP_CONFIG.PUBLIC_URL,
        render() {
          // Bersihkan & gambar QR
          const box = document.getElementById('qrcode');
          box.innerHTML = '';
          /* global QRCode */
          new QRCode(box, {
            text: this.url,
            width: 240,
            height: 240,
            colorDark: '#2f415b',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H,
          });
        },
        async copy() {
          try {
            await navigator.clipboard.writeText(this.url);
            UI && UI.toast ? UI.toast('Tautan disalin.', 'success') : alert('Tautan disalin.');
          } catch (_) {
            alert('Gagal menyalin.');
          }
        },
      }));
    });
  </script>
</body>
</html>
